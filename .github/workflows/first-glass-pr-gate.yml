name: First-Glass ITIL PR Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      preview-url:
        description: Optional preview URL for Tier 1 Playwright 3-viewport verification
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  first-glass:
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    uses: FogArmy-LLC/fogarmy-workflows/.github/workflows/first-glass-pr-gate.yml@7a3f7ebfeb013a34a4c2624a98e03e339eb54a95 # v1.3.2
    with:
      skills-ref: 7d843dcac54b1b63a695f6c240c43396cc418588
      preview-url: ${{ inputs.preview-url || '' }}
      post-github-review: true
